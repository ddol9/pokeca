name: test

# eng D8·D15: push·PR마다 실행한다. Vercel에서 이 검사를 필수로 지정하면 실패 시 프로덕션 배포가 막힌다.
# 모든 브랜치 push에서 돌고, 결과는 해당 커밋의 PR 체크로도 보인다.
on:
  push:
  workflow_dispatch:

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Start local Supabase
        run: npx supabase start -x studio,mailpit,imgproxy,vector,logflare,supavisor,realtime,edge-runtime

      - name: Export Supabase env
        run: |
          npx supabase status -o env > supabase.env
          set -a; . ./supabase.env; set +a
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL"
            echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$PUBLISHABLE_KEY"
            echo "SUPABASE_SECRET_KEY=$SECRET_KEY"
            echo "SUPABASE_DB_URL=$DB_URL"
            echo "REPORT_HASH_SECRET=ci-report-hash-secret"
            echo "CRON_SECRET=ci-cron-secret"
          } >> "$GITHUB_ENV"

      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: test-results/
          retention-days: 7
